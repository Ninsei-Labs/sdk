name: WalletConnect vendor

# The bundle is a composition, not an upstream release, so a path-filtered job rebuilds it from the checked-in
# lock and fails on any difference. Draft pull requests are skipped like the main CI: review comes first.
on:
  pull_request:
    paths:
      - assets/vendors/walletconnect/**
      - assets/vendors/MANIFEST.json
      - tools/vendors/walletconnect/**
      - tools/check-walletconnect-build.mjs
      - .github/workflows/walletconnect-vendor.yml
  push:
    branches: [main]
    paths:
      - assets/vendors/walletconnect/**
      - assets/vendors/MANIFEST.json
      - tools/vendors/walletconnect/**
      - tools/check-walletconnect-build.mjs
      - .github/workflows/walletconnect-vendor.yml
  workflow_dispatch:

concurrency:
  group: walletconnect-vendor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild the WalletConnect bundle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tools/vendors/walletconnect/package-lock.json

      - name: Install the pinned build dependencies
        working-directory: tools/vendors/walletconnect
        run: npm ci

      - name: Rebuild and compare the bundle
        run: npm run check:walletconnect-build

      - name: Show that the comparison can fail
        run: npm run check:walletconnect-build-teeth

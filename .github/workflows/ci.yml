name: CI

# The checks run on every pull request and on every push to main. The registry battery runs once under coverage;
# the steps here are setup, the guard-breaking runs and the checks that need an anvil or a live network.
on:
  pull_request:
    # `ready_for_review` is not part of the default pull_request types: without it, marking a draft ready would not
    # start the checks. Pushes to a draft still create a run, but every job is skipped below, so they cost no minutes.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: SDK checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm comes from the `packageManager` field in package.json, not from a version pinned here: there is one
      # place that says which package manager this package uses.
      - name: Set up pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm

      # ANVIL AND CAST COME FROM THE SAME PINNED FOUNDRY THE CONTRACT REPOSITORY USES. The fork check below needs
      # both; pinning here keeps the local run and CI on one node implementation.
      # FOUNDRYUP IS NOT USED. The toolchain action runs foundryup, whose installer resolves the `latest` release
      # from GitHub; a 504 on that one URL stopped every SDK job. The release download URL had the same 504, while
      # the API asset endpoint still served the file. This downloads the pinned asset by id and checks its published
      # SHA-256 before anything from it runs.
      - name: Install the pinned Foundry release
        env:
          FOUNDRY_VERSION: v1.9.0
          FOUNDRY_ASSET_ID: 703110190
          FOUNDRY_SHA256: 8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          asset="https://api.github.com/repos/foundry-rs/foundry/releases/assets/${FOUNDRY_ASSET_ID}"
          release="https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${archive}"
          mkdir -p "$RUNNER_TEMP/foundry"
          common=(
            --fail --location --retry 5 --retry-all-errors --retry-delay 5
            --connect-timeout 20 --max-time 300
            --output "$RUNNER_TEMP/$archive"
          )
          if ! curl "${common[@]}" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            "$asset"; then
            echo "The API asset endpoint failed; trying the release download URL." >&2
            curl "${common[@]}" "$release"
          fi
          printf '%s  %s\n' "$FOUNDRY_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry/anvil" --version
          "$RUNNER_TEMP/foundry/cast" --version

      # --frozen-lockfile: the lock file is the input, not something CI may rewrite.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE BROWSER ARTIFACT IS BUILT, NOT HAND-EDITED. A stale bundle is a second version of the core that the
      # page would load; rebuilding it here and refusing a diff keeps the committed file and the source together.
      - name: Build the browser bundle and check it is current
        run: |
          pnpm run build:sdk
          if ! git diff --quiet -- assets/vendors/sdk/sdk-browser.js; then
            echo "::error::assets/vendors/sdk/sdk-browser.js is stale; rebuild it with pnpm run build:sdk:docker"
            git diff --stat -- assets/vendors/sdk/sdk-browser.js
            exit 1
          fi

      - name: Keep the rebuilt bundle when it is stale
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-browser-rebuilt
          path: assets/vendors/sdk/sdk-browser.js
          if-no-files-found: ignore
          retention-days: 3

      - name: Check factory selectors
        run: pnpm run check:factory-selectors

      - name: Break the pack guard (both containers read, unknown shapes refused)
        run: pnpm run check:pack-teeth

      - name: Break the vendor-bundle guard (RED, then named)
        run: pnpm run check:vendor-bundles-teeth

      - name: Break the action-window and sell guards (RED, then restored)
        run: pnpm run check:guard-teeth

      - name: Break the entry-types guard (RED, then restored)
        run: pnpm run check:types-teeth

      - name: Break the refusals guard (RED, then restored)
        run: pnpm run check:refusals-teeth

      # THE AMOUNTS OF A TOKEN-FUNDED BUY. The escrow holds native coin, while the quote's token amount is a
      # different number; a quote without a native figure is a named refusal, never a rescale. The signed XMR
      # integer, not the rounded display number, is what the arrival check and the recovery file compare.
      - name: Check the native amount and the signed XMR atomic
        run: pnpm run check:native-amount

      - name: Break the decline guard (RED, then restored)
        run: pnpm run check:decline-teeth

      - name: Break the terminal-states guard (RED, then restored)
        run: pnpm run check:terminal-teeth

      # The release workflow's tag rule is a decision, so it is exercised on every change, not only at release time.
      - name: Check the release tag rule (version -> npm dist-tag)
        run: node tools/npm-tag.test.mjs

      # The withdrawal core's refusal behaviour is a package agreement as well: an empty remainder is a NAMED
      # refusal (insufficient-funds), and a low-level wallet error never escapes without a code. A unit run - no
      # browser, no contour: the wallet is a stand-in and the recovery file is built by the engine itself.
      - name: Check the withdrawal refusal (empty remainder -> insufficient-funds)
        run: pnpm run check:sweep

      # A REVEALED HALF IS ONE 32-BYTE WORD. The escrow's `revealedHalf()` used to be read as an address, keeping 20
      # bytes, so `(s_a + s_b)·G` never matched and every real withdrawal was refused.
      - name: Check the revealed half (32 bytes, never an address tail)
        run: pnpm run check:sweep-half

      # READING AN ARRIVAL WITHOUT A WALLET: the address and its keys, the little-endian scalar, whether a view key
      # matches, and the unlock_time rule. A second copy of the last one is the expensive kind - locked money reads
      # as an arrival.
      - name: Check the arrival read (address, key, unlock_time)
        run: pnpm run check:arrival-read

      # WHERE A MONERO NODE MAY LIVE. https anywhere, http on loopback, http to a remote host only on stagenet and
      # testnet - one policy for the node and for the page that lets an operator type an address.
      - name: Check the daemon address policy (https, loopback, network)
        run: pnpm run check:daemon-address

      # EVERY SCRIPT THE CI NAMES MUST EXIST. package.json and the workflows are edited in parallel, and a dropped
      # script failed only in CI, as ERR_PNPM_NO_SCRIPT, after a push.
      - name: Check that every script CI names exists
        run: pnpm run check:ci-scripts

      # WHAT A TRANSACTION WILL COST, BEFORE IT IS BUILT. The daemon's price per KB, by priority, and the one
      # arithmetic that turns it into a fee - rounded UP, because one unit short is still short.
      - name: Check the fee estimate (the price per KB and the fee for a size)
        run: pnpm run check:fee-estimate

      # SECONDS AT THE CHAIN, MILLISECONDS EVERYWHERE ELSE. One line once carried both, and a millisecond margin
      # subtracted from a seconds deadline looked like 1970 - the deadline was "past" before the check ever ran.
      - name: Check the deadline scale (seconds, milliseconds, one conversion)
        run: pnpm run check:deadline-scale


      # THE RESTORE PASS IS A PACKAGE RULE NOW. It used to live on the sweep page: a scan ten blocks below the
      # named height, a rescan, and ONE second pass when coins exist but none is spendable. A wrong height or a
      # missing pass looks like an empty wallet, not like an error - so the rule is exercised with a stand-in
      # driver, and each of its three load-bearing lines is cut in a copy to prove it reddens.
      - name: Check the restore pass (height, rescan, the one locked second pass)
        run: pnpm run check:restore

      - name: Check the CI boundary (no private repository checkout)
        run: pnpm run check:ci-boundary

      - name: Check the packed consumer (pack, install, import every subpath)
        run: pnpm run check:packed-consumer

      # THE GENERATED PINS ARE THE ONLY ADDRESS TABLE THE SDK EXPORTS. The check proves the generated bytes are
      # current and that a live CHAINS entry carries exactly its own network's pin.
      - name: Check the deployment pins (generated, per network)
        run: pnpm run check:deployment-pins

      - name: Check the live testnet contract (read-only)
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: pnpm run check:live-contract

      # A REAL ROUND TRIP ON A LOCAL FORK. Anvil forks Arbitrum Sepolia, so factory, registry, cashier and
      # implementation are the deployed ones; two unlocked accounts sign/register and fund an order, then claim it.
      # No testnet funds and no shared server. The check also dumps state and rewinds an EVM snapshot, so one fork
      # serves several scenarios.
      - name: Start anvil fork
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: tools/start-anvil-fork.sh --network arbitrum-sepolia --port 8545

      - name: Check anvil fork (register, fund, claim, snapshot)
        env:
          ANVIL_RPC: http://127.0.0.1:8545
        run: pnpm run check:anvil-fork

      # THE DEX INTENT PROVIDERS ARE AGREEMENTS WITH OTHER PROTOCOLS. CoW, Kyber, UniswapX and Uniswap Relay each
      # pin a real order vector, the EIP-712 digest that recovers its signer and the calldata encoding. They used
      # to run only in the release workflow through `pnpm run check`; a change in a type string or field order could
      # pass every PR. This step runs all four providers and their refusal tables.
      - name: Check DEX intents (CoW, Kyber, UniswapX, Uniswap Relay vectors)
        run: pnpm run check:dex

      # THE DEX CALLDATA AGAINST THE REAL ROUTER. A second fork of Ethereum mainnet carries the real USDC/WETH
      # pools and UniversalRouter. The test impersonates a USDC holder, moves the input to the router (the relay
      # shape pays from the router's own balance), executes the SDK's calldata and checks that native ETH reached
      # the recipient.
      - name: Start mainnet anvil fork
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          FALLBACK_RPC_URL: https://eth.drpc.org
        run: tools/start-anvil-fork.sh --network ethereum-mainnet --port 8546

      - name: Check anvil Uniswap (USDC to native through the real UniversalRouter)
        env:
          ANVIL_RPC: http://127.0.0.1:8546
        run: pnpm run check:anvil-uniswap

      # THE WALLET IS BUILT WITHOUT KNOWING THE LIBRARY. The page used to pass a `createWallet` callback that
      # translated "stagenet" into monero-ts's enum, and it owned the only `networkFromNode`. Both are the
      # package's: a caller passes the namespace, and an unknown nettype is null rather than a guess.
      - name: Check the wallet factory (the network word becomes the library's enum)
        run: pnpm run check:wallet-factory

      # XMR AMOUNTS ARE TWELVE DECIMALS AND BIGINT. A JavaScript number is exact only to about 9007 XMR in
      # piconero, and rounding an amount is a wrong payment that looks successful. Formatting keeps dust, parsing
      # refuses more than twelve decimals, and both are cut in a copy to prove the guard reddens.
      - name: Check XMR amounts (twelve decimals, no silent rounding)
        run: pnpm run check:xmr-amount

      # WHAT THE TRANSFER COSTS. A withdrawal moves the whole free remainder, so the fee comes out of it and the
      # recipient receives the rest. A wallet that cannot report a fee says null - a zero would be a claim the
      # package cannot support, and the interface would show a free transfer.
      - name: Check the signing preview (fee and what the recipient receives)
        run: pnpm run check:sign-preview

      # WHERE THE XMR GOES. The file names the recipient; sending elsewhere is a different payment, so the comparison
      # with the promise and with the file's network is the package's, not the interface's.
      - name: Check the destination (the promise, the network, the shape)
        run: pnpm run check:destination

      # WHAT A REFUSAL MEANS: may the interface offer a retry, and whose problem is it. The table sits beside the
      # vocabulary, and this guard keeps the two in step - a code with no meaning is a wrong piece of advice.
      - name: Check the refusal table (every code has a meaning)
        run: pnpm run check:codes-meta

      # IS THE NODE USABLE. One get_info request, and an answer that names why not - "unreachable" and "this node
      # names an unknown network" are different problems, and a preflight must agree with the wallet builder.
      - name: Check the node preflight (height, network, every failure named)
        run: pnpm run check:node-probe

      # THE REGISTRY IS THE LIST. The named steps above keep failures readable, but a check that was added to
      # `CHECKS` and not to this workflow used to run only in the release workflow: storage, scan-range,
      # funding-receipt, sweep-window, sweep-order, sweep-adapter, claim-sender, provider,
      # compose, entries, version and settlement-profiles were in that position. This last step runs every
      # registered check under NODE_V8_COVERAGE, so the battery and the coverage floor are one pass; the named
      # steps stay for diagnosis.
      - name: Run every registered SDK check and enforce coverage
        run: pnpm run coverage

  dleq-oracle:
    name: Go/Rust DLEQ oracle
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: test/dleq-oracle/go/go.sum
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the Go oracle reduction
        run: cd test/dleq-oracle/go && go test ./...
      - name: Build the Go oracle
        run: cd test/dleq-oracle/go && go build -buildvcs=false -o oracle ./cmd/oracle
      - name: Build the Rust verifier
        run: cd test/dleq-oracle/rust && cargo build --release --locked
      - name: Cross-check the two oracles and the SDK
        run: |
          DLEQ_GO_BIN=test/dleq-oracle/go/oracle \
          DLEQ_RUST_BIN=test/dleq-oracle/rust/target/release/dleq-verify \
          DLEQ_REQUIRE_RUST=1 \
          pnpm run check:dleq-oracle

  # ONE REQUIRED CHECK FOR BRANCH PROTECTION. A repository can require this job instead of every leaf job; it
  # runs even when a dependency fails (`always()`), so a skipped or cancelled dependency cannot look like a pass.
  required:
    name: Required CI
    # A draft run must not turn skipped dependencies into a red required check. On `ready_for_review` the draft
    # flag is false, and this job asserts the real results.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [checks, dleq-oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        run: |
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.dleq-oracle.result }}" = "success"

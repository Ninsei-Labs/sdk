name: CI

# The checks run on every pull request and on every push to main. Each check is its own NAMED step, so a red run
# says which agreement broke without opening the log: the failure carries the step's name.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm comes from the `packageManager` field in package.json, not from a version pinned here: there is one
      # place that says which package manager this package uses.
      - name: Set up pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: pnpm

      # --frozen-lockfile: the lock file is the input, not something CI may rewrite.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syntax (src and engine parse)
        run: pnpm run check:syntax

      - name: Check import (the entry point loads in bare Node)
        run: pnpm run check:import

      - name: Check surface (index.d.ts against the runtime, both ways)
        run: pnpm run check:surface

      - name: Check engine mirror (parses, no dangling imports)
        run: pnpm run check:mirror

      - name: Check package contents (the tarball against `files`)
        run: pnpm run check:pack

      - name: Check for secrets
        run: pnpm run check:secrets

      # Every published subpath must carry declarations: a subpath without a `types` target resolves to
      # nothing in a TypeScript consumer, and the entry a node needs then shows up as `any`. The check reads
      # the exports map, the declarations and the barrels - it needs no compiler.
      - name: Check entry types (every subpath declares what its barrel exports)
        run: pnpm run check:types

      # The guard above is exercised on a deliberately broken file: it must come back RED and NAME the
      # reason, and the file must be restored byte for byte. A guard without a breaking run is unverified.
      - name: Break the entry-types guard (RED, then restored)
        run: pnpm run check:types-teeth

      # The route-refusal vocabulary is a package agreement as well: every code a provider refuses with is
      # DECLARED, the four tables answer to that union, the union is used by a declaration instead of standing
      # beside the tables as a comment, and the `*Gate` verdict vocabulary is held out of both.
      - name: Check the route refusals (the tables against RouteRefusalCode)
        run: pnpm run check:refusals

      # And that guard is exercised on deliberately broken files too: the tables' declared type, the union's use
      # and the `*Gate` vocabulary each have their own case, each RED with its own reason, every file restored.
      - name: Break the refusals guard (RED, then restored)
        run: pnpm run check:refusals-teeth

      # THE MAKER'S DECLINE IS A STATE OF ITS OWN (issue #40): it is told apart from an ordinary refund by the
      # escrow's `Declined` event or by the node's `declined` + `compliance` status, it stops the wait for XMR at
      # once, it offers no recovery file and no manual refund - and it carries NO reason, category or provider.
      - name: Check the maker's decline (a state of its own, not a refunded escrow)
        run: pnpm run check:decline

      # And that guard is exercised on deliberately broken files: the event source and the status source each have
      # their own case, each RED with its own reason, every file restored byte for byte.
      - name: Break the decline guard (RED, then restored)
        run: pnpm run check:decline-teeth

      # The release workflow's tag rule is a decision, so it is exercised on every change, not only at release time.
      - name: Check the release tag rule (version -> npm dist-tag)
        run: node tools/npm-tag.test.mjs

      # The withdrawal core's refusal behaviour is a package agreement as well: an empty remainder is a NAMED
      # refusal (insufficient-funds), and a low-level wallet error never escapes without a code. A unit run - no
      # browser, no contour: the wallet is a stand-in and the recovery file is built by the engine itself.
      - name: Check the withdrawal refusal (empty remainder -> insufficient-funds)
        run: pnpm run check:sweep

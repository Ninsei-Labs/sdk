name: CI

# The checks run on every pull request and on every push to main. Each check is its own NAMED step, so a red run
# says which agreement broke without opening the log: the failure carries the step's name.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm comes from the `packageManager` field in package.json, not from a version pinned here: there is one
      # place that says which package manager this package uses.
      - name: Set up pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: pnpm

      # --frozen-lockfile: the lock file is the input, not something CI may rewrite.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syntax (src and engine parse)
        run: pnpm run check:syntax

      - name: Check import (the entry point loads in bare Node)
        run: pnpm run check:import

      - name: Check surface (index.d.ts against the runtime, both ways)
        run: pnpm run check:surface

      - name: Check engine mirror (parses, no dangling imports)
        run: pnpm run check:mirror

      - name: Check package contents (the tarball against `files`)
        run: pnpm run check:pack

      # The pack reader's agreement is with the packer's ANSWER, and that answer changed container between npm 11
      # (an array of one entry) and npm 12 (an object keyed by the package name): reading one container alone
      # reported eight problems that did not exist. The guard is exercised with the packer itself stubbed - both
      # containers must read to the same listing, and a shape that is neither (an empty one, one naming two
      # packages, one carrying no `files` list) must come back RED naming its reason, so the next change of shape
      # reddens here instead of passing as a tarball carrying nothing.
      - name: Break the pack guard (both containers read, unknown shapes refused)
        run: pnpm run check:pack-teeth

      - name: Check for secrets
        run: pnpm run check:secrets

      # Every published subpath must carry declarations: a subpath without a `types` target resolves to
      # nothing in a TypeScript consumer, and the entry a node needs then shows up as `any`. The check reads
      # the exports map, the declarations and the barrels - it needs no compiler.
      - name: Check entry types (every subpath declares what its barrel exports)
        run: pnpm run check:types

      # The guard above is exercised on a deliberately broken file: it must come back RED and NAME the
      # reason, and the file must be restored byte for byte. A guard without a breaking run is unverified.
      - name: Break the entry-types guard (RED, then restored)
        run: pnpm run check:types-teeth

      # The route-refusal vocabulary is a package agreement as well: every code a provider refuses with is
      # DECLARED, the four tables answer to that union, the union is used by a declaration instead of standing
      # beside the tables as a comment, and the `*Gate` verdict vocabulary is held out of both.
      - name: Check the route refusals (the tables against RouteRefusalCode)
        run: pnpm run check:refusals

      # And that guard is exercised on deliberately broken files too: the tables' declared type, the union's use
      # and the `*Gate` vocabulary each have their own case, each RED with its own reason, every file restored.
      - name: Break the refusals guard (RED, then restored)
        run: pnpm run check:refusals-teeth

      # THE MAKER'S DECLINE IS A STATE OF ITS OWN (issue #40): it is told apart from an ordinary refund by the
      # escrow's `Declined` event or by the node's `declined` + `compliance` status, it stops the wait for XMR at
      # once, it offers no recovery file and no manual refund - and it carries NO reason, category or provider.
      - name: Check the maker's decline (a state of its own, not a refunded escrow)
        run: pnpm run check:decline

      # And that guard is exercised on deliberately broken files: the event source and the status source each have
      # their own case, each RED with its own reason, every file restored byte for byte.
      - name: Break the decline guard (RED, then restored)
        run: pnpm run check:decline-teeth

      # THE TERMINAL STATE A SWAP ENDS IN (issue #40's family): the map in src/swaps.mjs is keyed by the kinds the
      # engine really writes - a REFUND is `kind: "refund_eth"`, and it used to be reported to the app as the
      # fallback `closed` - and a refund driven to the end by both of its writers (the depositor's own and the
      # watchtower's) must come back as `refunded_eth`.
      - name: Check the terminal states (a refund reports its own state, not the fallback)
        run: pnpm run check:terminal

      # And that guard is exercised on deliberately broken files: the dead key put back, the refund's code sent to
      # another declared code, a key nothing writes, the decline's own key dropped and a rename in the engine's
      # mirror - each RED with its own reason, every file restored byte for byte.
      - name: Break the terminal-states guard (RED, then restored)
        run: pnpm run check:terminal-teeth

      # The release workflow's tag rule is a decision, so it is exercised on every change, not only at release time.
      - name: Check the release tag rule (version -> npm dist-tag)
        run: node tools/npm-tag.test.mjs

      # The withdrawal core's refusal behaviour is a package agreement as well: an empty remainder is a NAMED
      # refusal (insufficient-funds), and a low-level wallet error never escapes without a code. A unit run - no
      # browser, no contour: the wallet is a stand-in and the recovery file is built by the engine itself.
      - name: Check the withdrawal refusal (empty remainder -> insufficient-funds)
        run: pnpm run check:sweep

      # THE RESTORE PASS IS A PACKAGE RULE NOW. It used to live on the sweep page: a scan ten blocks below the
      # named height, a rescan, and ONE second pass when coins exist but none is spendable. A wrong height or a
      # missing pass looks like an empty wallet, not like an error - so the rule is exercised with a stand-in
      # driver, and each of its three load-bearing lines is cut in a copy to prove it reddens.
      - name: Check the restore pass (height, rescan, the one locked second pass)
        run: pnpm run check:restore

      # THE RESTORE HEIGHT HAS ONE ORDER. The service's height wins when it knows one (it watches the address),
      # the file's is the fallback, and no height is a named state - not a refusal, because the person can type
      # one. The guard builds a real file and a stand-in service, and cuts each of the three load-bearing lines.
      - name: Check the restore height (service wins, file is the fallback, none is named)
        run: pnpm run check:restore-height

      # THE WALLET IS BUILT WITHOUT KNOWING THE LIBRARY. The page used to pass a `createWallet` callback that
      # translated "stagenet" into monero-ts's enum, and it owned the only `networkFromNode`. Both are the
      # package's: a caller passes the namespace, and an unknown nettype is null rather than a guess.
      - name: Check the wallet factory (the network word becomes the library's enum)
        run: pnpm run check:wallet-factory

      # XMR AMOUNTS ARE TWELVE DECIMALS AND BIGINT. A JavaScript number is exact only to about 9007 XMR in
      # piconero, and rounding an amount is a wrong payment that looks successful. Formatting keeps dust, parsing
      # refuses more than twelve decimals, and both are cut in a copy to prove the guard reddens.
      - name: Check XMR amounts (twelve decimals, no silent rounding)
        run: pnpm run check:xmr-amount

      # WHAT THE TRANSFER COSTS. A withdrawal moves the whole free remainder, so the fee comes out of it and the
      # recipient receives the rest. A wallet that cannot report a fee says null - a zero would be a claim the
      # package cannot support, and the interface would show a free transfer.
      - name: Check the signing preview (fee and what the recipient receives)
        run: pnpm run check:sign-preview

      # WHERE THE XMR GOES. The file names the recipient; sending elsewhere is a different payment, so the comparison
      # with the promise and with the file's network is the package's, not the interface's.
      - name: Check the destination (the promise, the network, the shape)
        run: pnpm run check:destination

name: CI

# The checks run on every pull request and on every push to main. Each check is its own NAMED step, so a red run
# says which agreement broke without opening the log: the failure carries the step's name.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm comes from the `packageManager` field in package.json, not from a version pinned here: there is one
      # place that says which package manager this package uses.
      - name: Set up pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm

      # ANVIL AND CAST COME FROM THE SAME PINNED FOUNDRY THE CONTRACT REPOSITORY USES. The fork check below needs
      # both; pinning here keeps the local run and CI on one node implementation.
      - name: Set up Foundry (anvil and cast, pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      # --frozen-lockfile: the lock file is the input, not something CI may rewrite.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syntax (src and engine parse)
        run: pnpm run check:syntax

      - name: Check import (the entry point loads in bare Node)
        run: pnpm run check:import

      - name: Check surface (index.d.ts against the runtime, both ways)
        run: pnpm run check:surface

      - name: Check engine mirror (parses, no dangling imports)
        run: pnpm run check:mirror

      # A field added to the signed quote changes both factory selectors. A stale pair is well-formed calldata
      # that calls a function the factory does not have, so this guard derives the selectors from QUOTE_FIELDS.
      - name: Check factory selectors
        run: pnpm run check:factory-selectors

      - name: Check package contents (the tarball against `files`)
        run: pnpm run check:pack

      # The pack reader's agreement is with the packer's ANSWER, and that answer changed container between npm 11
      # (an array of one entry) and npm 12 (an object keyed by the package name): reading one container alone
      # reported eight problems that did not exist. The guard is exercised with the packer itself stubbed - both
      # containers must read to the same listing, and a shape that is neither (an empty one, one naming two
      # packages, one carrying no `files` list) must come back RED naming its reason, so the next change of shape
      # reddens here instead of passing as a tarball carrying nothing.
      - name: Break the pack guard (both containers read, unknown shapes refused)
        run: pnpm run check:pack-teeth

      - name: Check for secrets
        run: pnpm run check:secrets

      # Every published subpath must carry declarations: a subpath without a `types` target resolves to
      # nothing in a TypeScript consumer, and the entry a node needs then shows up as `any`. The check reads
      # the exports map, the declarations and the barrels - it needs no compiler.
      - name: Check entry types (every subpath declares what its barrel exports)
        run: pnpm run check:types

      # The guard above is exercised on a deliberately broken file: it must come back RED and NAME the
      # reason, and the file must be restored byte for byte. A guard without a breaking run is unverified.
      - name: Break the entry-types guard (RED, then restored)
        run: pnpm run check:types-teeth

      # The route-refusal vocabulary is a package agreement as well: every code a provider refuses with is
      # DECLARED, the four tables answer to that union, the union is used by a declaration instead of standing
      # beside the tables as a comment, and the `*Gate` verdict vocabulary is held out of both.
      - name: Check the route refusals (the tables against RouteRefusalCode)
        run: pnpm run check:refusals

      # And that guard is exercised on deliberately broken files too: the tables' declared type, the union's use
      # and the `*Gate` vocabulary each have their own case, each RED with its own reason, every file restored.
      - name: Break the refusals guard (RED, then restored)
        run: pnpm run check:refusals-teeth

      # THE MAKER'S DECLINE IS A STATE OF ITS OWN (issue #40): it is told apart from an ordinary refund by the
      # escrow's `Declined` event or by the node's `declined` + `compliance` status, it stops the wait for XMR at
      # once, it offers no recovery file and no manual refund - and it carries NO reason, category or provider.
      - name: Check the maker's decline (a state of its own, not a refunded escrow)
        run: pnpm run check:decline

      # And that guard is exercised on deliberately broken files: the event source and the status source each have
      # their own case, each RED with its own reason, every file restored byte for byte.
      - name: Break the decline guard (RED, then restored)
        run: pnpm run check:decline-teeth

      # THE TERMINAL STATE A SWAP ENDS IN (issue #40's family): the map in src/swaps.mjs is keyed by the kinds the
      # engine really writes - a REFUND is `kind: "refund_eth"`, and it used to be reported to the app as the
      # fallback `closed` - and a refund driven to the end by both of its writers (the depositor's own and the
      # watchtower's) must come back as `refunded_eth`.
      - name: Check the terminal states (a refund reports its own state, not the fallback)
        run: pnpm run check:terminal

      # And that guard is exercised on deliberately broken files: the dead key put back, the refund's code sent to
      # another declared code, a key nothing writes, the decline's own key dropped and a rename in the engine's
      # mirror - each RED with its own reason, every file restored byte for byte.
      - name: Break the terminal-states guard (RED, then restored)
        run: pnpm run check:terminal-teeth

      # The release workflow's tag rule is a decision, so it is exercised on every change, not only at release time.
      - name: Check the release tag rule (version -> npm dist-tag)
        run: node tools/npm-tag.test.mjs

      # The withdrawal core's refusal behaviour is a package agreement as well: an empty remainder is a NAMED
      # refusal (insufficient-funds), and a low-level wallet error never escapes without a code. A unit run - no
      # browser, no contour: the wallet is a stand-in and the recovery file is built by the engine itself.
      - name: Check the withdrawal refusal (empty remainder -> insufficient-funds)
        run: pnpm run check:sweep

      # A REVEALED HALF IS ONE 32-BYTE WORD. The escrow's `revealedHalf()` used to be read as an address, keeping 20
      # bytes, so `(s_a + s_b)·G` never matched and every real withdrawal was refused.
      - name: Check the revealed half (32 bytes, never an address tail)
        run: pnpm run check:sweep-half

      # READING AN ARRIVAL WITHOUT A WALLET: the address and its keys, the little-endian scalar, whether a view key
      # matches, and the unlock_time rule. A second copy of the last one is the expensive kind - locked money reads
      # as an arrival.
      - name: Check the arrival read (address, key, unlock_time)
        run: pnpm run check:arrival-read

      # WHERE A MONERO NODE MAY LIVE. https anywhere, http on loopback, http to a remote host only on stagenet and
      # testnet - one policy for the node and for the page that lets an operator type an address.
      - name: Check the daemon address policy (https, loopback, network)
        run: pnpm run check:daemon-address

      # EVERY SCRIPT THE CI NAMES MUST EXIST. package.json and the workflows are edited in parallel, and a dropped
      # script failed only in CI, as ERR_PNPM_NO_SCRIPT, after a push.
      - name: Check that every script CI names exists
        run: pnpm run check:ci-scripts

      # WHAT A TRANSACTION WILL COST, BEFORE IT IS BUILT. The daemon's price per KB, by priority, and the one
      # arithmetic that turns it into a fee - rounded UP, because one unit short is still short.
      - name: Check the fee estimate (the price per KB and the fee for a size)
        run: pnpm run check:fee-estimate

      # SECONDS AT THE CHAIN, MILLISECONDS EVERYWHERE ELSE. One line once carried both, and a millisecond margin
      # subtracted from a seconds deadline looked like 1970 - the deadline was "past" before the check ever ran.
      - name: Check the deadline scale (seconds, milliseconds, one conversion)
        run: pnpm run check:deadline-scale


      # THE RESTORE PASS IS A PACKAGE RULE NOW. It used to live on the sweep page: a scan ten blocks below the
      # named height, a rescan, and ONE second pass when coins exist but none is spendable. A wrong height or a
      # missing pass looks like an empty wallet, not like an error - so the rule is exercised with a stand-in
      # driver, and each of its three load-bearing lines is cut in a copy to prove it reddens.
      - name: Check the restore pass (height, rescan, the one locked second pass)
        run: pnpm run check:restore

      # THE RESTORE HEIGHT HAS ONE ORDER. The service's height wins when it knows one (it watches the address),
      # the file's is the fallback, and no height is a named state - not a refusal, because the person can type
      # one. The guard builds a real file and a stand-in service, and cuts each of the three load-bearing lines.
      - name: Check the restore height (service wins, file is the fallback, none is named)
        run: pnpm run check:restore-height

      # THESE GUARDS USED TO RUN ONLY IN THE RELEASE WORKFLOW. Each one covers a defect from the 0.51.2 review:
      # a ticket that was not authenticated, a declined backup counted as saved, a foreign view half, a lying
      # witness, a proof not tied to its commitment, and the v1/v2 recovery paths. A regression in any of them
      # must redden a pull request, not the release after it.
      - name: Check sale authentication (the ticket and the signed tip)
        run: pnpm run check:sale-auth

      - name: Check backup confirmation (a declined key is not a saved key)
        run: pnpm run check:backup-confirmation

      - name: Check the one-key view half (the funded address matches the words)
        run: pnpm run check:key-view

      # THE HPKE PROFILE A RELAY REQUEST USES. The module is not exported yet, but its suite, context and
      # plaintext widths are wire agreements: a changed algorithm or word order must redden here rather than
      # fail only when a quote is encrypted for a real maker.
      - name: Check the relay view envelope (suite, context, widths)
        run: pnpm run check:relay-view

      - name: Check arrival consensus (every witness agrees on the whole observation)
        run: pnpm run check:arrival-consensus

      - name: Check a recorded arrival fixture (the block and transaction parser)
        run: pnpm run check:arrival-real

      - name: Check order proof binding (the proven point funds its own commitment)
        run: pnpm run check:order-proof

      # THE CONTRACT IS THE ORACLE. These fixed vectors were produced by `cast`, not by the SDK's own curve code:
      # three half commitments, the OrderCreated topic and both factory selectors. A green suite that derives its
      # expected value with the function under test cannot see a wrong point, unit or wire format.
      - name: Check contract vectors (commitments, event topic, selectors from cast)
        run: pnpm run check:contract-vectors

      # THE SEQUENCE THE PAGE RUNS, NOT ONLY ITS calldata. `runAtomicOrder` is called with a stand-in worker and a
      # stand-in funding call: the check proves the order of steps, the values passed across the boundary, and that
      # a refused counterparty never reaches funding.
      - name: Check the atomic order flow (build, verify, commit, fund)
        run: pnpm run check:atomic-flow

      # EVERY SIGNED FIELD MUST BE IN THE DIGEST. A field can be in ORDER_QUOTE_FIELDS and still be skipped by the
      # struct-hash loop; mutating one field at a time must change the digest, and deleting it must name it.
      - name: Check quote field binding (every field changes the digest)
        run: pnpm run check:quote-binding

      # THE DECLARATIONS MUST BE CONSUMABLE, NOT ONLY PARSEABLE. A minimal TypeScript consumer imports the root,
      # ./xmr and ./recovery and assigns the public interfaces; tsc --noEmit is the type gate that the textual
      # surface check cannot provide.
      - name: Check the TypeScript consumer (declarations compile)
        run: pnpm run check:types-consumer

      # THE TARBALL, NOT THE WORKING TREE. Pack the package, install that tarball in an empty project and import
      # every public subpath from it. This catches a missing asset or a subpath that only resolves from the repo.
      - name: Check the packed consumer (pack, install, import every subpath)
        run: pnpm run check:packed-consumer

      - name: Check recovery key paths (v1 index and v2 salt)
        run: pnpm run check:recovery-key

      - name: Check recovery file opening (text is parsed, v3 opens)
        run: pnpm run check:recovery-open

      # THE DEPLOYED CONTRACT IS THE ORACLE. One read-only call: the chain id, the factory and cashier code, and
      # implementation() + its code hash. No anvil, no wallet, no transaction; it catches a stale address, network
      # or implementation before anyone funds an order.
      - name: Check the live testnet contract (read-only)
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: pnpm run check:live-contract

      # A REAL ROUND TRIP ON A LOCAL FORK. Anvil forks Arbitrum Sepolia, so factory, registry, cashier and
      # implementation are the deployed ones; two unlocked accounts sign/register and fund an order, then claim it.
      # No testnet funds and no shared server. The check also dumps state and rewinds an EVM snapshot, so one fork
      # serves several scenarios.
      - name: Start anvil fork
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: |
          # --fork-state-by-number: several public RPCs answer the header by hash but cannot serve
          # eth_getBalance/getCode for that hash ("block not found"); read state by number instead. The retry
          # backoff covers a load-balanced endpoint that briefly answers behind the fork block.
          anvil --fork-url "$RPC_URL" --fork-state-by-number --fork-retry-backoff 1000 --retries 10 --port 8545 --chain-id 421614 > /tmp/anvil-fork.log 2>&1 &
          echo $! > /tmp/anvil-fork.pid
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/anvil-fork.log
          exit 1

      - name: Check anvil fork (register, fund, claim, snapshot)
        env:
          ANVIL_RPC: http://127.0.0.1:8545
        run: pnpm run check:anvil-fork

      # THE DEX INTENT PROVIDERS ARE AGREEMENTS WITH OTHER PROTOCOLS. CoW, Kyber, UniswapX and Uniswap Relay each
      # pin a real order vector, the EIP-712 digest that recovers its signer and the calldata encoding. They used
      # to run only in the release workflow through `pnpm run check`; a change in a type string or field order could
      # pass every PR. This step runs all four providers and their refusal tables.
      - name: Check DEX intents (CoW, Kyber, UniswapX, Uniswap Relay vectors)
        run: pnpm run check:dex

      # THE DEX CALLDATA AGAINST THE REAL ROUTER. A second fork of Ethereum mainnet carries the real USDC/WETH
      # pools and UniversalRouter. The test impersonates a USDC holder, moves the input to the router (the relay
      # shape pays from the router's own balance), executes the SDK's calldata and checks that native ETH reached
      # the recipient.
      - name: Start mainnet anvil fork
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          FALLBACK_RPC_URL: https://eth.drpc.org
        run: |
          # PIN A BLOCK EVERY ENDPOINT ALREADY HAS, BUT KEEP IT RECENT. A load-balanced endpoint can answer `latest`
          # from one node and then serve account state from another that is a few blocks behind; the fork then fails
          # while creating genesis with `block not found`. Forks far below the head are not a fix: public RPCs prune
          # that state and ask for an archive token. Five blocks is behind the spread and still current state.
          HEAD=""
          for url in "$RPC_URL" "$FALLBACK_RPC_URL"; do
            for i in $(seq 1 30); do
              candidate=$(cast block-number --rpc-url "$url" 2>/dev/null | head -1 || true)
              case "$candidate" in
                ''|*[!0-9]*) sleep 2 ;;
                *) HEAD="$candidate"; break ;;
              esac
            done
            [ -n "$HEAD" ] && break
          done
          if [ -z "$HEAD" ]; then
            echo "could not read a block number from any fork endpoint"
            exit 1
          fi
          FORK_BLOCK=$((HEAD - 5))
          if [ "$FORK_BLOCK" -lt 1 ]; then FORK_BLOCK=1; fi
          echo "forking mainnet at block $FORK_BLOCK (head $HEAD)"
          anvil --fork-url "$RPC_URL" --fork-url "$FALLBACK_RPC_URL" --fork-block-number "$FORK_BLOCK" --fork-state-by-number --fork-retry-backoff 1000 --retries 10 --port 8546 --chain-id 1 > /tmp/anvil-uniswap.log 2>&1 &
          echo $! > /tmp/anvil-uniswap.pid
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/anvil-uniswap.log
          exit 1

      - name: Check anvil Uniswap (USDC to native through the real UniversalRouter)
        env:
          ANVIL_RPC: http://127.0.0.1:8546
        run: pnpm run check:anvil-uniswap

      # THE WALLET IS BUILT WITHOUT KNOWING THE LIBRARY. The page used to pass a `createWallet` callback that
      # translated "stagenet" into monero-ts's enum, and it owned the only `networkFromNode`. Both are the
      # package's: a caller passes the namespace, and an unknown nettype is null rather than a guess.
      - name: Check the wallet factory (the network word becomes the library's enum)
        run: pnpm run check:wallet-factory

      # XMR AMOUNTS ARE TWELVE DECIMALS AND BIGINT. A JavaScript number is exact only to about 9007 XMR in
      # piconero, and rounding an amount is a wrong payment that looks successful. Formatting keeps dust, parsing
      # refuses more than twelve decimals, and both are cut in a copy to prove the guard reddens.
      - name: Check XMR amounts (twelve decimals, no silent rounding)
        run: pnpm run check:xmr-amount

      # WHAT THE TRANSFER COSTS. A withdrawal moves the whole free remainder, so the fee comes out of it and the
      # recipient receives the rest. A wallet that cannot report a fee says null - a zero would be a claim the
      # package cannot support, and the interface would show a free transfer.
      - name: Check the signing preview (fee and what the recipient receives)
        run: pnpm run check:sign-preview

      # WHERE THE XMR GOES. The file names the recipient; sending elsewhere is a different payment, so the comparison
      # with the promise and with the file's network is the package's, not the interface's.
      - name: Check the destination (the promise, the network, the shape)
        run: pnpm run check:destination

      # WHAT A REFUSAL MEANS: may the interface offer a retry, and whose problem is it. The table sits beside the
      # vocabulary, and this guard keeps the two in step - a code with no meaning is a wrong piece of advice.
      - name: Check the refusal table (every code has a meaning)
        run: pnpm run check:codes-meta

      # IS THE NODE USABLE. One get_info request, and an answer that names why not - "unreachable" and "this node
      # names an unknown network" are different problems, and a preflight must agree with the wallet builder.
      - name: Check the node preflight (height, network, every failure named)
        run: pnpm run check:node-probe

      # THE REGISTRY IS THE LIST. The named steps above keep failures readable, but a check that was added to
      # `CHECKS` and not to this workflow used to run only in the release workflow: storage, scan-range,
      # funding-receipt, sweep-window, sweep-order, sweep-adapter, claim-tip, claim-sender, quote-rank, provider,
      # compose, entries, version and settlement-profiles were in that position. This last step runs every
      # registered check, so a new entry is covered on the day it lands; the named steps stay for diagnosis.
      - name: Run every registered SDK check (the release battery)
        run: pnpm run check

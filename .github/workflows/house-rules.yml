name: house-rules
# The organisation's rules for text and commits (CONTRIBUTING.md in Ninsei-Labs/.github), checked by its
# shared workflow.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  house-rules:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: Ninsei-Labs/.github/.github/workflows/house-rules.yml@6f75e884d9fe579ae9bff4089ef6b5ec7a819415 # main

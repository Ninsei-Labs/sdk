# Publish @ninsei-labs/sdk to npm.
#
# AUTHENTICATION: npm trusted publishing (OIDC). There is NO npm token anywhere -
# not in secrets, not in .npmrc. The job asks GitHub for a short-lived signed
# identity token, npm verifies it against the trusted publisher configured on the
# package page, and only then allows the publish. This is why `id-token: write`
# below is load-bearing: without it npm finds no token and fails with ENEEDAUTH.
#
# One-time setup on npmjs.com (human, 2FA required): package Settings ->
# Trusted Publisher -> GitHub Actions, then fill in the owner, the repository,
# the workflow filename BOTH of these must read `release.yml`, and optionally an
# environment name. Publishing access should then be set to "require 2FA and
# disallow tokens", so a leaked token cannot publish anything.
#
# The package must already exist on npm for the trusted publisher to attach to
# it, so the very first version is published by hand.
#
# NOTE ON PROVENANCE: the SLSA attestation is only produced when both the
# repository and the package are public. While the repository is private the
# publish still works, the attestation is simply not generated.
#
# THE DIST-TAG IS DERIVED FROM THE VERSION, NOT LEFT TO A DEFAULT. An npm publish moves `latest` to the version
# it carries unless `--tag` is given, so a build for ourselves must say where it goes. `tools/npm-tag.mjs` is the
# one place that decides, and the publish step hands its answer to npm by name:
#   X.Y.Z              -> latest    a release: a separate decision, and the only thing that moves `latest`
#   X.Y.Z-develop.N    -> develop   a build for ourselves; the demo pins the EXACT version, not the tag
#   X.Y.Z-preview.N    -> preview   a build to show, pinned the same way
# A prerelease NEVER moves `latest`, and a plain version does not slide into a channel someone else owns: both are
# refusals that NAME the case, so a wrong version fails this run instead of tagging quietly. A manual run may
# override the tag with the `tag` input, and the step says so in the log before anything is sent.

name: Release

on:
  # Manual only. The owner decides when a version ships - no auto-publish on push.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack, but do not publish
        type: boolean
        default: true
      tag:
        description: >-
          Override the npm dist-tag (a decision; the version would otherwise pick it). Empty means derive it from
          the version. A prerelease can never be given `latest`.
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read # the CI run of the commit, read before a publish

jobs:
  # THE BUILD JOB HAS NO OIDC TOKEN. Every dependency build script (esbuild, keccak) runs here, where it cannot
  # mint the npm publishing token. The job packs one tarball and hands that exact file to the publish job.
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A VERSION IS PUBLISHED ONLY FROM A COMMIT ON MAIN WHOSE CI PASSED. The run read is CI's run of the push to
      # main for this exact commit. A tag is often pushed while that run still goes, so a queued or running run is
      # read again every 30 s for at most 20 minutes; then anything but success (cancelled, failed, missing, still
      # running) refuses before anything is built. Every run that publishes is checked, a manual one too; a dry run
      # publishes nothing and may build any branch.
      - name: The commit is on main and its CI passed
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main"
          deadline=$((SECONDS + 1200))
          while :; do
            state=$(gh api "$runs" --jq '.workflow_runs[0] | .conclusion // .status // "missing"')
            case $state in
              queued | waiting | pending | requested | in_progress) ;;
              *) break ;;
            esac
            [ $((SECONDS + 30)) -le "$deadline" ] || break
            echo "CI for $sha is $state; reading it again in 30 s"
            sleep 30
          done
          if [ "$state" != success ]; then
            echo "CI has not passed for $sha ($state)" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      # pnpm is this repository's package manager, so the lock file is pnpm's.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # No version here on purpose: packageManager in package.json is the one place that names pnpm.

      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          # A release must not ship a licence or notice state that the pull request did not verify.
          pnpm run check:licenses
          pnpm run check:notices

      # The tag the publish rides on is a decision, so it is exercised before it is taken.
      - name: The dist-tag derivation agrees with its own cases
        run: node tools/npm-tag.test.mjs

      - name: Version must match the tag
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json says $pkg, the tag says $tag" >&2
            exit 1
          fi

      # THE TAG, WORKED OUT AND NAMED BEFORE ANYTHING IS SENT. Derived from the version; a manual `tag` input
      # overrides it and is echoed as a decision.
      - name: Work out the npm dist-tag
        id: dist-tag
        env:
          OVERRIDE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ -n "${OVERRIDE_TAG:-}" ]; then
            echo "dist-tag: a manual tag input was given (${OVERRIDE_TAG}) for version ${version}; the derivation alone would say $(node tools/npm-tag.mjs "$version")"
            tag=$(node tools/npm-tag.mjs "$version" --override "$OVERRIDE_TAG")
          else
            tag=$(node tools/npm-tag.mjs "$version")
          fi
          echo "dist-tag: version ${version} will publish under the \"${tag}\" tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Pack the tarball that will be published
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      # WHAT A DRY RUN MEANS HERE. The tarball above is already the exact artifact the publish job receives. This
      # step adds the registry endpoint, the dist-tag and the file list without OIDC, npm authentication or a push.
      - name: Show the publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          echo "dry run: @ninsei-labs/sdk@${version} -> https://registry.npmjs.org/ under dist-tag '${DIST_TAG}'"
          pnpm publish --dry-run --no-git-checks --access public --tag "$DIST_TAG"
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-dry-run.json"
          node -e '
            const data = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const entry = Array.isArray(data) ? data[0] : Object.values(data)[0];
            if (!entry) { console.error("npm pack --dry-run returned no entry"); process.exit(1); }
            const files = entry.files || [];
            console.log(`tarball: ${entry.name}@${entry.version}, ${files.length} files, ${entry.size} bytes packed`);
            for (const file of files) {
              const path = typeof file === "string" ? file : file.path;
              const size = typeof file === "string" ? "" : ` (${file.size} bytes)`;
              console.log(`  ${path}${size}`);
            }
          ' "$RUNNER_TEMP/pack-dry-run.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 3

  # THE PUBLISH JOB HOLDS THE OIDC TOKEN AND INSTALLS NOTHING FROM THE PROJECT. It receives the tarball the build
  # job checked. A dependency build script has no path into this job.
  publish:
    name: Publish
    needs: build
    if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC exchange - required by npm trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org" # wires up the .npmrc the OIDC exchange rides on

      # The npm bundled with the runner image can be older than the trusted publishing floor (11.12.1), and an
      # old npm cannot do the OIDC exchange. This installs the tool, not the package's dependencies.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.19.1 --min-release-age=0
          npm --version

      - name: Publish the checked tarball
        env:
          DIST_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # THE TAG CROSSES THE JOB BOUNDARY AS DATA, NOT AS SHELL. It comes from a node script after dependency
          # build scripts have run; interpolating it into this script would let a compromised output run in the job
          # that holds id-token: write. Validate it here and use the environment variable, quoted.
          [[ "$DIST_TAG" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]] || {
            echo "dist-tag is not usable: $DIST_TAG" >&2
            exit 1
          }
          case "$DIST_TAG" in v[0-9]*) echo "dist-tag reads as a version: $DIST_TAG" >&2; exit 1 ;; esac
          tarball=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          # ./$tarball, not $tarball: npm reads a bare dist/... argument as a GitHub shorthand, not a local file.
          npm publish "./$tarball" --access public --provenance --ignore-scripts --tag "$DIST_TAG"

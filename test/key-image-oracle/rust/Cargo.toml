[package]
name = "key-image-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Independent Monero key-image oracle for SDK differential tests"

[dependencies]
curve25519-dalek = "4.1"
monero-ed25519 = "0.1"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 2

[package]
name = "dleq-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Independent MRL-0010 DLEQ verifier for the ninsei-dleq-vector/2 schema"

[dependencies]
k256 = "0.14"
curve25519-dalek = "5.0"
sha3 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 2

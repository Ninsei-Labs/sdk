[package]
name = "dleq-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Independent MRL-0010 DLEQ verifier for the ninsei-dleq-vector/2 schema"

[dependencies]
k256 = "0.13"
curve25519-dalek = "4.1"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 2
